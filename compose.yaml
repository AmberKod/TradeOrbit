name: tradeorbit
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tradeorbit
      POSTGRES_USER: tradeorbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env with the setup CLI first}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeorbit -d tradeorbit"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    image: tradeorbit-backend:local
    build: ./backend
    env_file: .env
    environment: &api-environment
      TRADEORBIT_DATABASE_URL: postgresql+asyncpg://tradeorbit:${POSTGRES_PASSWORD}@db:5432/tradeorbit
      TRADEORBIT_REDIS_URL: redis://cache:6379/0
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  backend:
    image: tradeorbit-backend:local
    build: ./backend
    env_file: .env
    environment: *api-environment
    ports: ["127.0.0.1:18000:18000"]
    networks: [app, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  worker:
    image: tradeorbit-backend:local
    build: ./backend
    environment:
      TRADEORBIT_REDIS_URL: redis://cache:6379/0
    command: ["python", "-m", "app.worker"]
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      cache: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  frontend:
    image: tradeorbit-frontend:local
    build: ./frontend
    ports: ["127.0.0.1:18080:8080"]
    networks: [app]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
networks:
  app: {}
  data: {}
volumes:
  postgres-data: {}
  redis-data: {}
