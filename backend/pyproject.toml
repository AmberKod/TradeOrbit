[project]
name = "tradeorbit-backend"
version = "0.1.0"
description = "TradeOrbit secure multi-exchange control plane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<2.2", "asyncpg>=0.30,<1",
  "alembic>=1.13,<2", "redis>=5,<8",
  "pydantic-settings>=2.6,<3", "email-validator>=2.2,<3",
  "cryptography>=44,<49", "argon2-cffi>=23,<26",
  "structlog>=24,<26",
]
[project.optional-dependencies]
dev = ["httpx>=0.28,<0.29", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "aiosqlite>=0.20,<1", "fakeredis>=2.26,<3", "ruff>=0.11,<1", "mypy>=1.13,<2"]
[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["app"]
